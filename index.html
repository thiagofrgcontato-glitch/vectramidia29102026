<style>
  /* Um cartão de vidro escuro flutuando sobre o líquido azul; coluna única pensada para o celular */
  :root {
    --void: #000000;      /* fundo da página */
    --carbon: #1c1c1c;    /* superfície levemente acima */
    --graphite: #4d4d4d;  /* linhas tracejadas */
    --steel: #808080;     /* textos secundários */
    --ash: #ababab;       /* subtítulo */
    --paper: #ffffff;     /* texto principal e botões */
    --paper-dim: #e4e4e4; /* botão branco ao passar o mouse */
    --peri: #7089ba;      /* caneta de anotação: só detalhes */
    --blue: #3f74e0;      /* azul vivo: luz de fundo e botão ao passar o mouse */
    --sheet: rgba(2, 6, 20, 0.30); /* folha escura e translúcida por cima do líquido */
    --paper-soft: rgba(255, 255, 255, 0.78);
    --line: rgba(255, 255, 255, 0.16);      /* linhas finas e contornos */
    --glass-hi: rgba(255, 255, 255, 0.42);  /* brilho da borda do vidro */
    --glass-blue: rgba(140, 180, 255, 0.50);/* reflexo azul na borda */
    --ice: #cfe0ff;
    --display: "Inter", "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html { background: var(--void); }
  body {
    background: var(--void);
    color: var(--paper);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* Fundo líquido (inspirado no monopo saigon), em azul: escorre devagar o tempo todo
     e se agita e acende quando a pessoa rola a página ou mexe o dedo/mouse. */
  .liquid { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; background: var(--void); }
  .no-gl .liquid {
    background:
      radial-gradient(55% 45% at 28% 30%, rgba(26, 92, 250, 0.55), transparent 70%),
      radial-gradient(50% 45% at 75% 72%, rgba(77, 56, 217, 0.45), transparent 70%),
      radial-gradient(35% 30% at 60% 45%, rgba(158, 214, 255, 0.25), transparent 70%),
      var(--void);
  }

  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    padding-block: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* A folha */
  .sheet {
    position: relative;
    width: 100%;
    max-width: 440px;
    border-radius: 32px;
    background: var(--sheet);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  /* Borda do vidro: uma linha fina que brilha em cima à esquerda e embaixo à direita */
  .sheet::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(155deg, var(--glass-hi) 0%, var(--line) 28%, rgba(255, 255, 255, 0.04) 55%, var(--glass-blue) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }

  .block { position: relative; }
  /* Divisória: uma linha que some nas pontas */
  .block + .block::before {
    content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line) 20%, rgba(255, 255, 255, 0.26) 50%, var(--line) 80%, transparent);
  }

  /* Topo */
  .hero {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 30px;
    padding: 48px 24px 36px;
  }
  /* Foto na bolinha: mostra a foto quase toda (só corta o fundo preto de cima) */
  .portrait { position: relative; width: 160px; height: 160px; margin-top: 4px; }
  .portrait img {
    width: 100%; height: 100%; border-radius: 50%; display: block;
    object-fit: cover; object-position: 50% 78%;
    background: var(--void);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
  }
  .portrait::before {
    content: ""; position: absolute; inset: -11px; border-radius: 50%;
    border: 1px solid var(--line);
  }
  .orbit {
    position: absolute; inset: -12px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 200deg, var(--blue) 300deg, var(--ice) 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    transform: rotate(var(--rot, 0deg));
  }
  .portrait .dot {
    position: absolute; inset: -12px; border-radius: 50%; pointer-events: none;
    transform: rotate(var(--rot, 0deg));
  }
  .portrait .dot::after {
    content: ""; position: absolute; top: -2px; left: 50%; margin-left: -3px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--ice);
    box-shadow: 0 0 10px 2px rgba(120, 170, 255, 0.85);
  }
  .hero-text { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-weight: 500; font-size: 12px;
    letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.6;
    color: var(--paper);
    border: 1px solid var(--line); border-radius: 100px;
    background: rgba(255, 255, 255, 0.06);
    padding: 5px 14px;
  }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--peri); flex: none; }

  h1 {
    margin: 0;
    font-weight: 900;
    font-size: clamp(54px, 17vw, 70px);
    line-height: 0.95;
    letter-spacing: -0.045em;
    text-wrap: balance;
  }
  .lede {
    margin: 0; max-width: 28ch;
    font-size: 16px; line-height: 1.6; letter-spacing: -0.01em;
    color: var(--paper-soft);
  }

  /* Botões */
  .actions { display: grid; gap: 12px; padding: 28px 24px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    min-height: 56px; box-sizing: border-box;
    padding: 12px 20px 12px 22px;
    border-radius: 100px;
    font-family: var(--display); font-size: 16px; font-weight: 500; letter-spacing: -0.01em;
    text-decoration: none;
    transition: background-color .18s ease, color .18s ease, transform .1s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .social:focus-visible { outline: 2px solid var(--peri); outline-offset: 3px; }
  .btn svg { flex: none; }
  .btn .go { margin-left: auto; }

  /* Botão do WhatsApp: o azul "pinta" o botão da esquerda para a direita,
     uma luz segue o mouse por dentro e aparece um contorno tracejado de prancheta */
  .btn-main {
    position: relative; isolation: isolate; overflow: hidden;
    background: var(--paper); color: var(--void); border: 1px solid var(--paper);
    outline: 1px solid transparent; outline-offset: 6px;
    transition: color .3s ease, border-color .3s ease, outline-color .3s ease, outline-offset .3s ease, transform .1s ease;
  }
  .btn-main::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
    background: linear-gradient(100deg, var(--blue) 0%, var(--peri) 100%);
    transform: scaleX(0); transform-origin: left center;
    transition: transform .5s cubic-bezier(.2, .75, .2, 1);
  }
  .btn-main::after {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
    background: radial-gradient(circle 90px at var(--bx, 50%) var(--by, 50%), rgba(255,255,255,.28), transparent 70%);
    opacity: 0; transition: opacity .3s ease;
  }
  .btn-main .ico, .btn-main .go { transition: transform .35s cubic-bezier(.2, .75, .2, 1); }
  .btn-main .tag { transition: color .3s ease; }
  .btn-main.is-on { color: var(--paper); border-color: var(--blue); outline-color: var(--glass-blue); outline-offset: 4px; }
  .btn-main.is-on::before { transform: scaleX(1); }
  .btn-main.is-on::after { opacity: 1; }
  .btn-main.is-on .tag { color: var(--paper-soft); }
  .btn-main.is-on .go { transform: translate(3px, -3px); }
  .btn-main.is-on .ico { animation: ring .6s ease; }
  @keyframes ring {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); }
    60% { transform: rotate(-7deg); } 80% { transform: rotate(4deg); }
  }
  @media (hover: hover) {
    .btn-main:hover { color: var(--paper); border-color: var(--blue); outline-color: var(--glass-blue); outline-offset: 4px; }
    .btn-main:hover::before { transform: scaleX(1); }
    .btn-main:hover::after { opacity: 1; }
    .btn-main:hover .tag { color: var(--paper-soft); }
    .btn-main:hover .go { transform: translate(3px, -3px); }
    .btn-main:hover .ico { animation: ring .6s ease; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-main::before { transition: none; }
    .btn-main .ico { animation: none !important; }
  }
  .btn-main .txt { display: flex; flex-direction: column; text-align: left; line-height: 1.3; min-width: 0; }
  .btn-main .tag {
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--graphite);
  }

  .btn-line { background: transparent; color: var(--paper); border: 1px solid var(--paper); justify-content: flex-start; }
  .btn-line:hover { background: var(--carbon); border-color: var(--peri); }

  .socials { display: flex; justify-content: center; gap: 12px; padding-top: 12px; }
  .social {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--paper);
    background: rgba(255, 255, 255, 0.05);
    position: relative; overflow: hidden; isolation: isolate;
    transition: border-color .25s ease, background-color .25s ease, transform .35s cubic-bezier(.2, .75, .2, 1);
  }
  .social svg { position: relative; z-index: 1; transition: transform .35s cubic-bezier(.2, .75, .2, 1); }
  .social:hover { border-color: var(--paper); background: var(--carbon); }

  /* Instagram: ao passar o mouse, a bolinha se enche de um líquido com as cores do logo */
  .ig-liquid {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0;
    border-radius: 50%; opacity: 0; transform: scale(0.4);
    transition: opacity .35s ease, transform .55s cubic-bezier(.2, .75, .2, 1);
  }
  .social.ig.no-gl .ig-liquid {
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
  }
  .social.ig.is-on { border-color: rgba(255, 255, 255, 0.55); transform: scale(1.08); }
  .social.ig.is-on .ig-liquid { opacity: 1; transform: scale(1); }
  .social.ig.is-on svg { transform: scale(1.1); }

  /* Rodapé */
  .foot {
    padding: 14px 24px;
    font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
    color: var(--steel); text-align: center;
  }
</style>

<script>
(function () {
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var btn = document.querySelector('.btn-main');

  // ---------- Botão do WhatsApp: luz que segue o mouse e efeito no toque ----------
  if (btn) {
    btn.addEventListener('pointermove', function (e) {
      var b = btn.getBoundingClientRect();
      btn.style.setProperty('--bx', (e.clientX - b.left) + 'px');
      btn.style.setProperty('--by', (e.clientY - b.top) + 'px');

    btn.addEventListener('touchstart', function () { btn.classList.add('is-on'); }, { passive: true });

    });

  // ---------- "Energia": rolar, girar a rodinha ou arrastar o dedo agita o líquido ----------
  var energy = 0.9;

  function kick(a) { energy = Math.min(1.6, energy + a); }
  window.addEventListener('scroll', function () {
    var y = window.scrollY || 0; kick(Math.abs(y - lastY) / 60); lastY = y;
  }, { passive: true });

  var touchY = null;
  window.addEventListener('touchstart', function (e) { touchY = e.touches[0] ? e.touches[0].clientY : null; }, { passive: true });
  window.addEventListener('touchmove', function (e) {

    kick(Math.abs(t.clientY - touchY) / 250); touchY = t.clientY;
  }, { passive: true });
  var mouse = { x: 0.5, y: 0.5 }, mouseT = { x: 0.5, y: 0.5 };

    mouseT.x = e.clientX / window.innerWidth; mouseT.y = 1 - e.clientY / window.innerHeight;
  }, { passive: true });

  // ---------- O líquido (o mesmo desenho serve para o fundo e para a bolinha do Instagram) ----------
  var VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
  var FS = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH',
    'precision highp float;',
    '#else',
    'precision mediump float;',
    '#endif',
    'uniform vec2 uRes; uniform float uFlow; uniform float uLum; uniform float uVig; uniform float uZoom; uniform vec2 uMouse;',

    'float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }',

    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }',
    'float fbm(vec2 p){ float v = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);',
    '  for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p; a *= 0.5; } return v; }',
    'void main(){',
    '  vec2 uv = gl_FragCoord.xy / uRes;',
    '  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y) * uZoom;',
    '  p += (uMouse - 0.5) * 0.35;',
    '  float t = uFlow;',
    '  vec2 q = vec2(fbm(p + vec2(0.0, t * 0.6)), fbm(p + vec2(5.2, 1.3) - t * 0.4));',
    '  vec2 r = vec2(fbm(p + 3.5 * q + vec2(1.7, 9.2) + t * 0.3), fbm(p + 3.5 * q + vec2(8.3, 2.8) - t * 0.25));',
    '  float f = fbm(p + 3.0 * r);',
    '  vec3 col = mix(uC0, uC1, smoothstep(0.05, 0.40, f));',
    '  col = mix(col, uC2, smoothstep(0.30, 0.70, f) * (0.65 + 0.35 * q.x));',

    var loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var U = {};
    ['uRes', 'uFlow', 'uLum', 'uVig', 'uZoom', 'uMouse', 'uC0', 'uC1', 'uC2', 'uC3', 'uC4', 'uSheen'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
    o.colors.forEach(function (c, i) { gl.uniform3fv(U['uC' + i], c); });
    gl.uniform3fv(U.uSheen, o.sheen); gl.uniform1f(U.uVig, o.vig); gl.uniform1f(U.uZoom, o.zoom);
    return function draw(flow, lum, mx, my) {
      var s = Math.min(window.devicePixelRatio || 1, 2) * o.scale;
      var w = Math.max(1, Math.round(canvas.clientWidth * s)), h = Math.max(1, Math.round(canvas.clientHeight * s));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
      gl.uniform2f(U.uRes, w, h); gl.uniform1f(U.uFlow, flow); gl.uniform1f(U.uLum, lum); gl.uniform2f(U.uMouse, mx, my);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
  }

  // Fundo: tons de azul
  var drawBg = makeLiquid(document.getElementById('liquid'), {
    colors: [[0.01, 0.015, 0.05], [0.03, 0.09, 0.32], [0.10, 0.36, 0.98], [0.30, 0.22, 0.85], [0.62, 0.84, 1.00]],
    sheen: [0.3, 0.6, 1.0], vig: 0.7, zoom: 1.6, scale: 0.4
  });
  if (!drawBg) document.documentElement.classList.add('no-gl');

  // Bolinha do Instagram: as cores do logo (roxo, magenta, rosa, laranja e amarelo)
  var igLink = document.querySelector('.social.ig');
  var drawIg = makeLiquid(document.getElementById('ig-liquid'), {
    colors: ['#7a2fc4', '#f56040', '#e1306c', '#c13584', '#fcc35a'].map(hex),
    sheen: [1.0, 0.7, 0.45], vig: 1.0, zoom: 1.5, scale: 1
  });
  if (!drawIg && igLink) igLink.classList.add('no-gl');
  var igOn = false, igMix = 0, igFlow = 0;
  if (igLink) {
    var on = function () { igOn = true; igLink.classList.add('is-on'); };
    var off = function () { igOn = false; igLink.classList.remove('is-on'); };
    igLink.addEventListener('pointerenter', function (e) { if (e.pointerType !== 'touch') on(); });
    igLink.addEventListener('pointerleave', function (e) { if (e.pointerType !== 'touch') off(); });
    igLink.addEventListener('focus', on); igLink.addEventListener('blur', off);
    igLink.addEventListener('touchstart', function () { on(); setTimeout(off, 1200); }, { passive: true });
  }

  if (calm) {
    var still = function () { if (drawBg) drawBg(3.0, 1.0, 0.5, 0.5); if (drawIg) drawIg(2.0, 1.05, 0.5, 0.5); };
    still(); window.addEventListener('resize', still);
    return;
  }

  var portrait = document.querySelector('.portrait');
  var flow = 3.0, glow = 0.6, last = performance.now(), start = last;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    energy *= Math.pow(0.2, dt);                                   // a agitação vai acalmando
    glow += (Math.min(1, energy) - glow) * Math.min(1, dt * 3);    // brilho sobe quando agita
    flow += dt * (0.12 + glow * 0.9);                              // e o líquido corre mais rápido
    mouse.x += (mouseT.x - mouse.x) * Math.min(1, dt * 2.5);
    mouse.y += (mouseT.y - mouse.y) * Math.min(1, dt * 2.5);
    if (drawBg) drawBg(flow, 0.8 + 0.45 * glow, mouse.x, mouse.y);
    // O anel azul da foto gira sozinho devagar e acelera quando a pessoa rola
    if (portrait) portrait.style.setProperty('--rot', ((now - start) / 1000 * 7.5 + flow * 30).toFixed(2) + 'deg');

    // O Instagram só é desenhado enquanto está aparecendo (economiza bateria)
    igMix += ((igOn ? 1 : 0) - igMix) * Math.min(1, dt * 6);
    if (drawIg && igMix > 0.01) { igFlow += dt * 0.9; drawIg(igFlow + 2.0, 1.05, 0.5, 0.5); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
